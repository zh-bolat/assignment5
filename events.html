    <section>
      <h2>Task 5. Mouse Events</h2>
      <div id="hoverBox">Hover me</div>
    </section>
    <section>
      <h2>Task 6. Keyboard Events</h2>
      <input type="text" id="textInput" placeholder="Type something">
      <p>You typed: <span id="output"></span></p>
    </section>
    <section>
      <h2>Task 7. Calculator</h2>
      <input type="number" id="num1" placeholder="First number">
      <input type="number" id="num2" placeholder="Second number">
      <br>
      <button id="addCalc">+</button>
      <button id="subCalc">-</button>
      <button id="mulCalc">*</button>
      <button id="divCalc">/</button>
      <p>Result: <span id="result"></span></p>
